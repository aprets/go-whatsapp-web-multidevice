name: Build full-history image

# Builds this branch (upstream release + PR #855 + FULL history-sync storage) for one linked device's
# pairing. Published as ghcr.io/<owner>/go-whatsapp-web-multidevice:full-history, amd64 only.
on:
  workflow_dispatch:
  push:
    branches: [full-history]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          push: true
          context: .
          file: ./docker/golang.Dockerfile
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/go-whatsapp-web-multidevice:full-history
            ghcr.io/${{ github.repository_owner }}/go-whatsapp-web-multidevice:full-history-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
